<div class="flex flex-col gap-2" data-list-demo>
  <div data-list-place>
    <sf-view id="home-orders" aria-label="Заказы" heading="Заказы" head="list" size="1/2" record-card="home-order" preferences-key="view.home-list">
      <sf-view-table slot="content" aria-label="Заказы"></sf-view-table>
      <sf-pagination slot="pagination" top="false" page-size="10" page-sizes="10,20,50,100"></sf-pagination>
    </sf-view>
  </div>
  <div class="flex flex-col gap-1/2" data-record-place hidden>
    <div><sf-button data-record-back size="1/2" appearance="ghost" scheme="on-surface" icon-start="arrow_back" text="Заказы"></sf-button></div>
    <h2 class="m-0" data-record-title></h2>
    <sf-view-properties id="home-order-page" aria-label="Заказ" panel full size="1/2" mode="auto" collection-label="Заказ" collection-icon="receipt_long"></sf-view-properties>
  </div>
  <sf-view-properties id="home-order" aria-label="Карточка заказа" panel hidden mode="auto" size="1/2" collection-label="Заказ" collection-icon="receipt_long"></sf-view-properties>
  <p class="m-0 color-on-surface-variant" role="status" data-log>Переключите вид в полосе представления — «Таблица», «Канбан», «Карточки», «Календарь» — и откройте заказ: карточка встанет рядом со списком, короткие поля правятся прямо в ней.</p>
</div>
