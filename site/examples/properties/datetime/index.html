<div data-properties class="flex flex-col gap-3">
  <section class="flex flex-col gap-1" aria-label="Ячейка таблицы и фильтр">
    <p class="m-0 weight-6">Ячейка таблицы и фильтр</p>
      <sf-view aria-label="Записи" preferences-key="view.properties-datetime">
        <sf-view-table slot="content" aria-label="Записи" layout="auto" selectable="false"></sf-view-table>
        <sf-pagination slot="pagination" page-size="10" page-sizes="10,25" top="false"></sf-pagination>
      </sf-view>
  </section>
  <div class="flex flex-wrap gap-1 items-cross-center" role="group" aria-label="Запись в карточках" data-record-switch>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2 active" data-record="r-1" aria-pressed="true"><span class="sf-button-text-container">Первая запись</span></button>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-record="r-2" aria-pressed="false"><span class="sf-button-text-container">Вторая запись</span></button>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-record="r-3" aria-pressed="false"><span class="sf-button-text-container">Пустые значения</span></button>
  </div>
  <div class="grid gap-3 property-cards">
    <section class="flex flex-col gap-1 min-w-0" aria-label="Показ">
      <p class="m-0 weight-6">Показ</p>
      <sf-view-properties aria-label="Показ" mode="view" data-follows></sf-view-properties>
    </section>
    <section class="flex flex-col gap-1 min-w-0" aria-label="Правка">
      <p class="m-0 weight-6">Правка</p>
      <sf-view-properties aria-label="Правка" mode="edit" data-follows></sf-view-properties>
    </section>
  </div>
  <p class="m-0 color-on-surface-variant" role="status" data-log>Измените поля в правке и нажмите «Сохранить» — здесь будет то, что получило приложение.</p>
  <section class="flex flex-col gap-2" aria-label="Состояния">
    <p class="m-0 weight-6">Состояния</p>
    <div class="grid gap-3 property-states">
      <section class="flex flex-col gap-1 min-w-0" aria-label="Пусто">
        <p class="m-0 weight-6">Пусто</p>
        <sf-view-properties aria-label="Пусто" mode="view" data-record="r-3"></sf-view-properties>
      </section>
      <section class="flex flex-col gap-1 min-w-0" aria-label="Ошибка">
        <p class="m-0 weight-6">Ошибка</p>
        <sf-view-properties aria-label="Ошибка" mode="edit" data-state="error"></sf-view-properties>
      </section>
      <section class="flex flex-col gap-1 min-w-0" aria-label="Только чтение">
        <p class="m-0 weight-6">Только чтение</p>
        <sf-view-properties aria-label="Только чтение" mode="edit" data-state="readonly"></sf-view-properties>
      </section>
      <section class="flex flex-col gap-1 min-w-0" aria-label="Телефон">
        <p class="m-0 weight-6">Телефон</p>
        <div class="flex flex-col gap-2 property-phone">
      <sf-view aria-label="Записи" preferences-key="view.properties-datetime-phone">
        <sf-view-table slot="content" aria-label="Записи" layout="auto" selectable="false"></sf-view-table>
        <sf-pagination slot="pagination" page-size="10" page-sizes="10,25" top="false"></sf-pagination>
      </sf-view>
          <sf-view-properties aria-label="Телефон" mode="view"></sf-view-properties>
        </div>
      </section>
    </div>
  </section>
</div>
