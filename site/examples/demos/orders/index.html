<div class="flex flex-col gap-2" data-orders-demo>
  <div class="flex flex-wrap gap-1 items-center" role="group" aria-label="Состояние заказа" data-status-filter>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2 active" data-status="" aria-pressed="true"><span class="sf-button-text-container">Все</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-status="new" aria-pressed="false"><span class="sf-button-text-container">Новые</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-status="assembly" aria-pressed="false"><span class="sf-button-text-container">Собираются</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-status="shipped" aria-pressed="false"><span class="sf-button-text-container">Отгружены</span></button>
  </div>
  <div class="grid gap-2 orders-layout">
    <sf-view id="orders-view" aria-label="Заказы" preferences-key="view.demo-orders">
      <sf-view-table slot="content" aria-label="Заказы" layout="auto" search-placeholder="Номер, покупатель или город"></sf-view-table>
      <sf-pagination slot="pagination" page-sizes="10,25,50" top="false"></sf-pagination>
    </sf-view>
    <aside class="orders-card" aria-label="Выбранный заказ">
      <p class="m-0 color-on-surface-variant" data-orders-hint>Откройте заказ из списка, чтобы увидеть его карточку.</p>
      <sf-view-properties id="order-card" aria-label="Карточка заказа" hidden></sf-view-properties>
    </aside>
  </div>
  <p class="m-0 color-on-surface-variant" role="status" data-orders-log></p>
</div>
